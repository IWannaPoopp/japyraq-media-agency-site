<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Продакшн полного цикла. Видео, фото, мобилография, дрон-съемка и контент для бизнеса и мероприятий по всему Казахстану."
    />
    <title>Japyraq Media — Видео, фото и контент для бизнеса в Казахстане</title>
    <script>history.scrollRestoration = "manual";
      const savedTheme = localStorage.getItem("japyraq-theme");
      const theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
